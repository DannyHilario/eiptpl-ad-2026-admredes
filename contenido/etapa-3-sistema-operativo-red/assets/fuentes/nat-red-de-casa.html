<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAT en la red de tu casa · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>NAT en la red de tu casa</h1>

    <div class="diagram-container">
      <svg viewBox="0 56 1000 424"xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nat-red-de-casa-title nat-red-de-casa-desc">
        <title id="nat-red-de-casa-title">NAT en la red de tu casa</title>
        <desc id="nat-red-de-casa-desc">Tres dispositivos con IP privada salen a Internet a través del router, que los hace aparecer a todos con su única IP pública.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect x="0" y="56" width="1000" height="424" fill="#f5f5f5"/>
        <rect x="0" y="56" width="1000" height="424" fill="url(#dots)" opacity="0.55"/>

        <!-- Zonas -->
        <rect x="40" y="88" width="440" height="280" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="192" y="92" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">RED PRIVADA · TU CASA</text>

        <rect x="640" y="88" width="320" height="280" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="768" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">INTERNET</text>

        <!-- Flechas (antes que los nodos) -->
        <path d="M 232,152 H 308 Q 316,152 316,160 V 204 Q 316,212 324,212 H 400"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="232" y1="232" x2="400" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 232,312 H 308 Q 316,312 316,304 V 260 Q 316,252 324,252 H 400"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="560" y1="220" x2="704" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 704,244 H 560" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Etiquetas de flechas -->
        <rect x="596" y="198" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="207" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IP PÚBLICA</text>

        <rect x="600" y="252" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESPUESTA</text>

        <!-- Nodo: Laptop -->
        <rect x="72" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="120" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="92" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="152" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laptop</text>
        <text x="152" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.20</text>

        <!-- Nodo: Celular -->
        <rect x="72" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="200" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="94" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CEL</text>
        <text x="152" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Celular</text>
        <text x="152" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.21</text>

        <!-- Nodo: Smart TV -->
        <rect x="72" y="280" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="280" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="92" y="297" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TV</text>
        <text x="152" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Smart TV</text>
        <text x="152" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.22</text>

        <!-- Nodo: Router (focal) -->
        <rect x="400" y="192" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="192" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="408" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="422" y="209" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
        <text x="480" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="480" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dentro: 192.168.1.1</text>
        <text x="480" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fuera: 203.0.113.7</text>

        <!-- Nodo: Sitio web -->
        <rect x="704" y="200" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="200" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="726" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="800" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sitio web</text>
        <text x="800" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google.com</text>

        <!-- Notas -->
        <text x="260" y="392" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">IP privadas: solo valen dentro de tu casa</text>
        <text x="800" y="392" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Desde afuera solo se ve la IP pública</text>

        <!-- Leyenda -->
        <line x1="40" y1="416" x2="960" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="448" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Router que hace NAT</text>

        <rect x="200" y="448" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="220" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dispositivo de tu casa</text>

        <rect x="368" y="448" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="388" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Servidor en Internet</text>

        <line x1="536" y1="454" x2="564" y2="454" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="572" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sale con la IP pública</text>

        <line x1="736" y1="454" x2="764" y2="454" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="772" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respuesta</text>
      </svg>
    </div>
  </div>
</body>
</html>
