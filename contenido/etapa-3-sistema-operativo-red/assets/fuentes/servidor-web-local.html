<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu servidor web en tu red local · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Tu servidor web en tu red local</h1>

    <div class="diagram-container">
      <svg viewBox="0 16 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="servidor-web-local-title servidor-web-local-desc">
        <title id="servidor-web-local-title">Tu servidor web en tu red local</title>
        <desc id="servidor-web-local-desc">La laptop y el celular de la misma casa abren la página de nginx en la VM; un compañero desde su casa, en Internet, no puede entrar porque el router lo detiene.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect x="0" y="16" width="1000" height="480" fill="#f5f5f5"/>
        <rect x="0" y="16" width="1000" height="480" fill="url(#dots)" opacity="0.55"/>

        <!-- Zonas -->
        <rect x="40" y="40" width="640" height="344" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="292" y="44" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">TU RED LOCAL · TU CASA</text>

        <rect x="720" y="40" width="240" height="344" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="808" y="44" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">INTERNET</text>

        <!-- Visitas dentro de la red local (antes que los nodos) -->
        <path d="M 248,232 H 336 Q 344,232 344,240 V 248 Q 344,256 352,256 H 440"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 248,328 H 336 Q 344,328 344,320 V 296 Q 344,288 352,288 H 440"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Compañero desde Internet: el router no lo deja pasar -->
        <path d="M 860,232 V 108 Q 860,100 852,100 H 760"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <circle cx="860" cy="168" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
        <line x1="856" y1="164" x2="864" y2="172" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="864" y1="164" x2="856" y2="172" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Etiquetas de flechas -->
        <rect x="372" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="245" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP :80</text>

        <rect x="372" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP :80</text>

        <rect x="868" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="892" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP :80</text>

        <!-- Nodo: Router -->
        <rect x="600" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="608" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="622" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
        <text x="680" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="680" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.1</text>

        <!-- Nodo: Laptop -->
        <rect x="72" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="200" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="92" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="160" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu laptop</text>
        <text x="160" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">navegador · Git Bash</text>

        <!-- Nodo: Celular -->
        <rect x="72" y="296" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="296" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="80" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="94" y="313" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CEL</text>
        <text x="160" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu celular</text>
        <text x="160" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mismo Wi-Fi</text>

        <!-- Nodo: VM con nginx (focal) -->
        <rect x="440" y="232" width="192" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="232" width="192" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="448" y="240" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="460" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
        <text x="536" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu servidor</text>
        <text x="536" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.57</text>
        <text x="536" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nginx :80 · ssh :22</text>

        <!-- Nodo: Compañero -->
        <rect x="776" y="232" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="232" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="784" y="240" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="796" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="860" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Un compañero</text>
        <text x="860" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desde su casa</text>

        <!-- Notas -->
        <text x="360" y="412" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Laptop, celular y servidor están en la misma red: se ven entre sí</text>
        <text x="840" y="412" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">El NAT del router no lo deja entrar</text>

        <!-- Leyenda -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="468" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tu servidor con nginx</text>

        <rect x="208" y="468" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="228" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Equipo que visita la página</text>

        <rect x="400" y="468" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="420" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Router de tu casa</text>

        <line x1="552" y1="474" x2="580" y2="474" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="588" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Visita desde tu laptop</text>

        <line x1="696" y1="474" x2="724" y2="474" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="732" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Desde tu celular</text>

        <line x1="832" y1="474" x2="860" y2="474" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="868" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bloqueada</text>
      </svg>
    </div>
  </div>
</body>
</html>
