<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo traduce el router · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Cómo traduce el router</h1>

    <div class="diagram-container">
      <svg viewBox="0 24 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nat-traduccion-title nat-traduccion-desc">
        <title id="nat-traduccion-title">Cómo traduce el router</title>
        <desc id="nat-traduccion-desc">El router cambia la IP de origen de un paquete de la IP privada de la laptop a su IP pública, anota el cambio en la tabla NAT y usa esa tabla para devolver la respuesta a la laptop.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect x="0" y="24" width="1000" height="400" fill="#f5f5f5"/>
        <rect x="0" y="24" width="1000" height="400" fill="url(#dots)" opacity="0.55"/>

        <!-- Flechas de ida (antes que los nodos) -->
        <line x1="184" y1="112" x2="224" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="392" y1="112" x2="432" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="568" y1="112" x2="608" y2="112" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="776" y1="112" x2="816" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Router anota en la tabla -->
        <line x1="500" y1="144" x2="500" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Respuesta: sitio web -> router -> laptop -->
        <path d="M 884,144 V 184 Q 884,192 876,192 H 540 Q 532,192 532,184 V 144"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 468,144 V 184 Q 468,192 460,192 H 124 Q 116,192 116,184 V 144"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Etiquetas de flechas -->
        <rect x="508" y="200" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="526" y="209"fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANOTA</text>

        <rect x="672" y="200" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESPUESTA</text>

        <rect x="248" y="200" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SE LA ENTREGA</text>

        <!-- Nodo: Laptop -->
        <rect x="48" y="80" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="80" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="88" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="68" y="97" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="116" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laptop</text>
        <text x="116" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.20</text>

        <!-- Nodo: Paquete al salir -->
        <rect x="224" y="64" width="168" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="224" y="64" width="168" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="232" y="72" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="254" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAQUETE</text>
        <text x="308" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Al salir de casa</text>
        <text x="308" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">origen: 192.168.1.20</text>
        <text x="308" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">destino: google.com</text>

        <!-- Nodo: Router (focal) -->
        <rect x="432" y="80" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="80" width="136" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="440" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="454" y="97" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
        <text x="500" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="500" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cambia el origen</text>

        <!-- Nodo: Paquete en Internet -->
        <rect x="608" y="64" width="168" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="64" width="168" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="616" y="72" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="638" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAQUETE</text>
        <text x="692" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ya en Internet</text>
        <text x="692" y="128" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">origen: 203.0.113.7</text>
        <text x="692" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">destino: google.com</text>

        <!-- Nodo: Sitio web -->
        <rect x="816" y="80" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="80" width="136" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="824" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="838" y="97" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="884" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sitio web</text>
        <text x="884" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google.com</text>

        <!-- Nodo: Tabla NAT -->
        <rect x="400" y="216" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="216" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="408" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="426" y="233" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLA</text>
        <text x="500" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tabla NAT</text>
        <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">laptop: puerto 40001</text>
        <text x="500" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">celular: puerto 40002</text>

        <!-- Nota -->
        <text x="500" y="336" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">El router anota quién pidió qué, para saber a quién entregarle cada respuesta</text>

        <!-- Leyenda -->
        <line x1="40" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="392" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Router que hace NAT</text>

        <rect x="184" y="392" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="204" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tu laptop</text>

        <rect x="280" y="392" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Paquete</text>

        <rect x="368" y="392" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="388" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Memoria del router</text>

        <rect x="512" y="392" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="532" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Servidor en Internet</text>

        <line x1="680" y1="398" x2="708" y2="398" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="716" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ya con la IP pública</text>

        <line x1="840" y1="398" x2="868" y2="398" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="876" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respuesta</text>
      </svg>
    </div>
  </div>
</body>
</html>
