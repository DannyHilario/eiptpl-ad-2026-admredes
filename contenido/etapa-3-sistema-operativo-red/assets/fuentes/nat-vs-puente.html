<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu VM en modo NAT y en modo puente · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Tu VM en modo NAT y en modo puente</h1>

    <div class="diagram-container">
      <svg viewBox="0 16 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nat-vs-puente-title nat-vs-puente-desc">
        <title id="nat-vs-puente-title">Tu VM en modo NAT y en modo puente</title>
        <desc id="nat-vs-puente-desc">En modo NAT la VM queda detrás del NAT de VirtualBox y la laptop no puede conectarse a ella por SSH; en modo puente la VM recibe una IP del router y la laptop sí se conecta.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect x="0" y="16" width="1000" height="488" fill="#f5f5f5"/>
        <rect x="0" y="16" width="1000" height="488" fill="url(#dots)" opacity="0.55"/>

        <!-- Zonas -->
        <rect x="40" y="40" width="440" height="352" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="224" y="44" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">MODO NAT</text>

        <rect x="520" y="40" width="440" height="352" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="700" y="44" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">MODO PUENTE</text>

        <!-- Conexiones (antes que los nodos) -->
        <line x1="260" y1="128" x2="260" y2="152" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="260" y1="208" x2="260" y2="232" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="260" y1="288" x2="260" y2="312" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- SSH que no llega (modo NAT) -->
        <path d="M 348,180 H 400 Q 408,180 408,188 V 332 Q 408,340 400,340 H 348"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <circle cx="408" cy="260" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
        <line x1="404" y1="256" x2="412" y2="264" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="412" y1="256" x2="404" y2="264" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="416" y="206" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH</text>

        <!-- Modo puente: router reparte IP a laptop y VM -->
        <path d="M 712,128 V 156 Q 712,164 704,164 H 644 Q 636,164 636,172 V 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 768,128 V 156 Q 768,164 776,164 H 844 Q 852,164 852,172 V 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- SSH que sí llega (modo puente) -->
        <line x1="712" y1="228" x2="776" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="730" y="208" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH</text>

        <!-- MODO NAT: Router -->
        <rect x="172" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="172" y="72" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="180" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="194" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RED</text>
        <text x="260" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="260" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.1</text>

        <!-- MODO NAT: Laptop -->
        <rect x="172" y="152" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="172" y="152" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="180" y="160" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="192" y="169" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="260" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu laptop</text>
        <text x="260" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.20</text>

        <!-- MODO NAT: NAT de VirtualBox (focal) -->
        <rect x="172" y="232" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="172" y="232" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="180" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="194" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
        <text x="260" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NAT de VirtualBox</text>
        <text x="260" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">red privada 10.0.2.0/24</text>

        <!-- MODO NAT: VM -->
        <rect x="172" y="312" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="172" y="312" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="180" y="320" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="192" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
        <text x="260" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ubuntu Server</text>
        <text x="260" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.15</text>

        <!-- MODO PUENTE: Router -->
        <rect x="652" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="652" y="72" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="660" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="674" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RED</text>
        <text x="740" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="740" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.1</text>

        <!-- MODO PUENTE: Laptop -->
        <rect x="560" y="200" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="200" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="568" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="580" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="636" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu laptop</text>
        <text x="636" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.20</text>

        <!-- MODO PUENTE: VM -->
        <rect x="776" y="200" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="200" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="784" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="796" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
        <text x="852" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ubuntu Server</text>
        <text x="852" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.57</text>

        <!-- Notas -->
        <text x="260" y="420" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">La VM queda escondida detrás de tu laptop</text>
        <text x="740" y="420" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">La VM es un equipo más de la red</text>

        <!-- Leyenda -->
        <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="472" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">NAT de VirtualBox</text>

        <rect x="200" y="472" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="220" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Equipo físico</text>

        <rect x="336" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="356" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Máquina virtual</text>

        <line x1="488" y1="478" x2="516" y2="478" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="524" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SSH llega a la VM</text>

        <line x1="672" y1="478" x2="700" y2="478" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="708" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SSH no llega</text>
      </svg>
    </div>
  </div>
</body>
</html>
