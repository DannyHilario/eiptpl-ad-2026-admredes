<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una red, dos subredes · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Caso hipotético</p>
    <h1>Una red, dos subredes</h1>

    <div class="diagram-container">
      <svg viewBox="0 48 1000 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="subredes-title subredes-desc">
        <title id="subredes-title">Una red, dos subredes</title>
        <desc id="subredes-desc">La red 192.168.10.0/24 de una escuela dividida en dos subredes /25, Laboratorio y Administración, que solo se comunican entre sí a través del router.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect x="0" y="48" width="1000" height="572" fill="#f5f5f5"/>

        <!-- Zonas: subredes -->
        <rect x="32" y="176" width="456" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
        <rect x="44" y="180" width="236" height="12" rx="2" fill="#f5f5f5"/>
        <text x="162" y="189" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBRED A · LABORATORIO · .0/25</text>

        <rect x="512" y="176" width="456" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
        <rect x="712" y="180" width="244" height="12" rx="2" fill="#f5f5f5"/>
        <text x="834" y="189" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBRED B · ADMINISTRACIÓN · .128/25</text>

        <!-- Conexiones (antes que los nodos) -->
        <!-- Router → Switch A (interfaz .1) -->
        <path d="M450,128 V152 Q450,160 442,160 H268 Q260,160 260,168 V216" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="310" y="142" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERFAZ .1</text>

        <!-- Router → Switch B (interfaz .129), con salto sobre la ruta naranja -->
        <path d="M550,128 V152 Q550,160 558,160 H572 a 8,8 0 0,1 16,0 H732 Q740,160 740,168 V216" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="608" y="142" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="660" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERFAZ .129</text>

        <!-- Switch A → PCs -->
        <path d="M233,272 V296 Q233,304 225,304 H156 Q148,304 148,312 V336" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M287,272 V296 Q287,304 295,304 H364 Q372,304 372,312 V336" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- Switch B → PCs -->
        <path d="M713,272 V296 Q713,304 705,304 H667 Q659,304 659,312 V336" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M767,272 V296 Q767,304 775,304 H844 Q852,304 852,312 V336" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Misma subred: directo -->
        <path d="M148,400 V408 Q148,416 156,416 H364 Q372,416 372,408 V404" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="216" y="424" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="433" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECTO</text>

        <!-- Entre subredes: paso 1, PC Lab 2 → router -->
        <path d="M464,360 H492 Q500,360 500,352 V132" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="400" y="238" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="446" y="247" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 · AL ROUTER</text>
        <!-- Entre subredes: paso 2, router → PC Dirección -->
        <line x1="580" y1="128" x2="580" y2="332" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="588" y="196" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="205" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 · REENVÍA</text>

        <!-- Nodos -->
        <!-- Router (foco) -->
        <rect x="400" y="64" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="64" width="200" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="408" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="422" y="79" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
        <text x="500" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
        <text x="500" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.0/24 → 2 × /25</text>

        <!-- Switch A -->
        <rect x="180" y="216" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="216" width="160" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="188" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="202" y="231" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
        <text x="260" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Switch</text>
        <text x="260" y="264" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">laboratorio</text>

        <!-- Switch B -->
        <rect x="660" y="216" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="216" width="160" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <rect x="668" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="682" y="231" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
        <text x="740" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Switch</text>
        <text x="740" y="264" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">administración</text>

        <!-- PCs subred A -->
        <rect x="56" y="336" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="336" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="78" y="351" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="148" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PC Lab 1</text>
        <text x="148" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.10</text>

        <rect x="280" y="336" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="336" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="288" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="302" y="351" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="372" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PC Lab 2</text>
        <text x="372" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.11</text>

        <!-- PCs subred B -->
        <rect x="536" y="336" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="336" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="544" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="558" y="351" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="628" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PC Dirección</text>
        <text x="628" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.140</text>

        <rect x="760" y="336" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="336" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="768" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="782" y="351" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
        <text x="852" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PC Control escolar</text>
        <text x="852" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.141</text>

        <!-- Datos de cada subred -->
        <text x="56" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">rango      192.168.10.1 – .126</text>
        <text x="56" y="480" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">máscara    255.255.255.128  (/25)</text>
        <text x="56" y="496" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">gateway    192.168.10.1</text>

        <text x="536" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">rango      192.168.10.129 – .254</text>
        <text x="536" y="480" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">máscara    255.255.255.128  (/25)</text>
        <text x="536" y="496" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">gateway    192.168.10.129</text>

        <!-- Anotación -->
        <text x="32" y="544" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">Dentro de una subred, los equipos se hablan directo. Para llegar a otra subred,</text>
        <text x="32" y="560" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">el paquete tiene que pasar por el router: él es la única puerta entre las dos.</text>

        <!-- Leyenda -->
        <line x1="32" y1="576" x2="968" y2="576" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="32" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <line x1="112" y1="597" x2="140" y2="597" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="148" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">cable</text>
        <line x1="208" y1="597" x2="236" y2="597" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="244" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">misma subred: directo</text>
        <line x1="440" y1="597" x2="468" y2="597" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="476" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">otra subred: a través del router</text>
      </svg>
    </div>
  </div>
</body>
</html>
