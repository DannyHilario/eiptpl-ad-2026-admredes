<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red de la escuela en 4 subredes · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Evidencia 4</p>
    <h1>La red de la escuela dividida en 4 subredes</h1>

    <div class="scroll">
    <svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="subredes-escuela-title subredes-escuela-desc">
      <title id="subredes-escuela-title">La red de la escuela dividida en 4 subredes</title>
      <desc id="subredes-escuela-desc">La red 192.168.10.0/24 de la escuela se divide en cuatro subredes /26, una por área: Laboratorio, Dirección, Control escolar y Wi-Fi de invitados, conectadas entre sí solo a través del router.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Zone: red de la escuela -->
      <rect x="32" y="176" width="936" height="188" rx="8"
            fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <rect x="172" y="180" width="192" height="12" rx="2" fill="#2d3142"/>
      <text x="268" y="189" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">RED DE LA ESCUELA · 192.168.10.0/24</text>

      <!-- Connectors first: router to each subnet gateway -->
      <path d="M 404,112 V 132 Q 404,140 396,140 H 160 Q 152,140 152,148 V 208"
            fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
      <path d="M 468,112 V 148 Q 468,156 460,156 H 392 Q 384,156 384,164 V 208"
            fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
      <path d="M 532,112 V 148 Q 532,156 540,156 H 608 Q 616,156 616,164 V 208"
            fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
      <path d="M 596,112 V 132 Q 596,140 604,140 H 840 Q 848,140 848,148 V 208"
            fill="none" stroke="#bfc0c0" stroke-width="1.2"/>

      <!-- Node: Router (focal) -->
      <rect x="340" y="40" width="320" height="72" rx="6" fill="#2d3142"/>
      <rect x="340" y="40" width="320" height="72" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <rect x="348" y="48" width="48" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="372" y="57" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
      <text x="500" y="80" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router de la escuela</text>
      <text x="500" y="96" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">única puerta entre áreas · 4 × /26</text>

      <!-- Node: Laboratorio -->
      <rect x="48" y="208" width="208" height="140" rx="6" fill="#2d3142"/>
      <rect x="48" y="208" width="208" height="140" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="56" y="216" width="56" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="84" y="225" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBRED 1</text>
      <text x="152" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laboratorio</text>
      <text x="152" y="272" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.0/26</text>
      <text x="152" y="288" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equipos .1 – .62</text>
      <text x="152" y="304" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">broadcast .63</text>
      <text x="152" y="320" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway .1</text>

      <!-- Node: Dirección -->
      <rect x="280" y="208" width="208" height="140" rx="6" fill="#2d3142"/>
      <rect x="280" y="208" width="208" height="140" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="288" y="216" width="56" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="316" y="225" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBRED 2</text>
      <text x="384" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dirección</text>
      <text x="384" y="272" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.64/26</text>
      <text x="384" y="288" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equipos .65 – .126</text>
      <text x="384" y="304" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">broadcast .127</text>
      <text x="384" y="320" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway .65</text>

      <!-- Node: Control escolar (protected: security treatment) -->
      <rect x="512" y="208" width="208" height="140" rx="6" fill="#2d3142"/>
      <rect x="512" y="208" width="208" height="140" rx="6" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="520" y="216" width="56" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="548" y="225" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBRED 3</text>
      <text x="616" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control escolar</text>
      <text x="616" y="272" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.128/26</text>
      <text x="616" y="288" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equipos .129 – .190</text>
      <text x="616" y="304" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">broadcast .191</text>
      <text x="616" y="320" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway .129</text>
      <text x="616" y="336" fill="#f08a59" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aquí está el equipo .150</text>

      <!-- Node: Wi-Fi invitados (external) -->
      <rect x="744" y="208" width="208" height="140" rx="6" fill="#2d3142"/>
      <rect x="744" y="208" width="208" height="140" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="752" y="216" width="56" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="780" y="225" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBRED 4</text>
      <text x="848" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wi-Fi invitados</text>
      <text x="848" y="272" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.10.192/26</text>
      <text x="848" y="288" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equipos .193 – .254</text>
      <text x="848" y="304" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">broadcast .255</text>
      <text x="848" y="320" fill="#8e98ac" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway .193</text>

      <!-- Editorial caption -->
      <text x="48" y="400" fill="#f5f5f5" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Dentro de cada área los equipos se hablan directo. Para pasar a otra área, todo cruza el router:</text>
      <text x="48" y="418" fill="#f5f5f5" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">ahí se ponen las reglas, como que el Wi-Fi de invitados no llegue a Control escolar.</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="40" y="468" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="60" y="476" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Router (puerta entre áreas)</text>

      <rect x="216" y="468" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="236" y="476" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Subred interna</text>

      <rect x="340" y="468" width="14" height="10" rx="2" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="360" y="476" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Subred protegida (calificaciones)</text>

      <rect x="532" y="468" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="552" y="476" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Subred de visitantes</text>

      <line x1="676" y1="473" x2="704" y2="473" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="712" y="476" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Conexión al gateway de cada subred</text>
    </svg>
    </div>
  </div>
</body>
</html>
